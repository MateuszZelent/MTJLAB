[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-control"
version = "0.1.0"
description = "Safe local control software for a Rigol, Keithley and Anritsu measurement station."
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.11",
  "numpy>=1.26",
  "pydantic>=2.7,<3",
  "PySide6>=6.7",
  "pyqtgraph>=0.13.7,<0.14",
  "pyvisa>=1.14",
  "pyvisa-py>=0.7",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "PyThat==0.2.14"]

[project.scripts]
lab-control = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["recipes*", "submodules*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
