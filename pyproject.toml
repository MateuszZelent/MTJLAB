[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-control"
version = "0.1.0"
description = "Safe local control software for a Rigol, Keithley and Anritsu measurement station."
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.11",
  "h5netcdf>=1.8,<2",
  "numpy>=1.26",
  "pydantic>=2.7,<3",
  "PySide6>=6.7",
  "PySide6-Fluent-Widgets==1.11.2",
  "pyqtgraph>=0.13.7,<0.14",
  "PyThat==0.2.14",
  "pyvisa>=1.14",
  "pyvisa-py>=0.7",
  "lakeshore==1.10.0",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lab-control = "app.main:main"
lab-control-qualify = "app.qualification.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["recipes*", "submodules*", "tests*"]

[tool.setuptools.package-data]
app = ["ui/assets/icons/*.svg", "resources/*.yml", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "qualification: long-running GUI responsiveness qualification",
]

[tool.ruff]
line-length = 100
target-version = "py311"
