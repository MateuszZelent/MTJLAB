schema_version: 1
name: "Keithley A 100 uA to zero with Anritsu raw and processed spectra"

# Safe MS2830A analogue of the positive branch in the historical thaTEC file.
# The historical 0.1 A value was the Bruker supply accuracy, not its sweep
# start.  The present station profile limits Keithley channel A to +/-1 mA,
# so a literal 0.1 A request must remain blocked by preflight validation.

dut_limits:
  keithley:
    A:
      current: {min: "0 A", max: "100 uA"}
      voltage: {min: "-100 mV", max: "100 mV"}
      max_abs_power: "10 uW"
  anritsu:
    max_expected_input: "-10 dBm"

root:
  id: keithley-a-anritsu-measurement
  type: sequence
  children:
    - id: keithley-a-output-off-initial
      type: set_keithley_output
      channel: A
      enabled: false

    - id: anritsu-spectrum-configuration
      type: configure_anritsu
      start_frequency: "10 MHz"
      stop_frequency: "4 GHz"
      reference_level: "0 dBm"
      points: 5001
      trace: TRAC1

    # Configure the first sweep value while OUTPUT is confirmed OFF.
    - id: keithley-a-initial-configuration
      type: configure_keithley
      channel: A
      mode: current
      level: "100 uA"
      compliance: "100 mV"
      nplc: 1.0
      settle_time: "100 ms"
      sense_mode: 2wire
      source_autorange: true
      measure_voltage_autorange: true
      measure_current_autorange: true

    # OUTPUT is enabled once here, after configuration, and remains enabled
    # throughout the sweep.
    - id: keithley-a-output-on
      type: set_keithley_output
      channel: A
      enabled: true

    - id: reference-settle
      type: wait
      duration: "10 s"

    - id: anritsu-reference-at-100ua
      type: acquire_reference
      trace: TRAC1
      average_count: 3

    - id: keithley-a-current-sweep
      type: sweep
      target: keithley.A.current
      start: "100 uA"
      stop: "0 A"
      points: 10
      spacing: linear
      children:
        - id: keithley-a-current-point
          type: update_keithley_level
          channel: A
          mode: current
          level: "${keithley.A.current}"

        - id: current-point-settle
          type: wait
          duration: "10 s"

        - id: anritsu-raw-and-reference-difference
          type: acquire_spectrum
          trace: TRAC1
          average_count: 3
          reference_operation: difference_db
          store_raw: true
          store_processed: true

finally:
  - id: keithley-a-output-off-finally
    type: set_keithley_output
    channel: A
    enabled: false
