schema_version: 1
name: "Keithley B current × Rigol sine frequency × Anritsu reference processing"

# Requested Cartesian experiment:
#   10 Keithley current points × 100 Rigol frequency points = 1000 spectra.
# OUTPUT is enabled once after the reference acquisition. Point-update actions
# change only the selected setpoint and preserve every other device parameter.
#
# The station profile remains the independent hardware safety authority. This
# recipe does not override device capabilities or approved laboratory limits.

dut_limits:
  keithley:
    B:
      current: {min: "0 A", max: "150 mA"}
      voltage: {min: "-67 mV", max: "67 mV"}
      max_abs_power: "10.05 mW"
  rigol:
    1:
      minimum_impedance: "50 ohm"
      max_abs_current: "20 uA"
      max_abs_power: "20 nW"
  anritsu:
    max_expected_input: "-10 dBm"

root:
  id: measurement-sequence
  type: sequence
  children:
    - id: rigol-output-off-initial
      type: set_rigol_output
      channel: 1
      enabled: false

    - id: keithley-output-off-initial
      type: set_keithley_output
      channel: B
      enabled: false

    - id: anritsu-spectrum-configuration
      type: configure_anritsu
      start_frequency: "1 MHz"
      stop_frequency: "10 MHz"
      reference_level: "0 dBm"
      points: 1001
      trace: TRAC1

    - id: anritsu-reference
      type: acquire_reference
      trace: TRAC1

    - id: keithley-b-initial-configuration
      type: configure_keithley
      channel: B
      mode: current
      level: "0 A"
      compliance: "67 mV"
      nplc: 1.0
      sense_mode: 2wire
      source_autorange: true
      measure_voltage_autorange: true
      measure_current_autorange: true

    - id: rigol-ch1-initial-configuration
      type: configure_rigol
      channel: 1
      waveform: SIN
      frequency: "100 kHz"
      high_level: "1 mV"
      low_level: "-1 mV"
      output_load: HIGHZ
      dut_min_impedance: "50 ohm"

    - id: keithley-b-output-on
      type: set_keithley_output
      channel: B
      enabled: true

    - id: rigol-ch1-arm
      type: arm_rigol_output
      channel: 1

    - id: rigol-ch1-output-on
      type: set_rigol_output
      channel: 1
      enabled: true

    - id: keithley-b-current-sweep
      type: sweep
      target: keithley.B.current
      start: "0 A"
      stop: "150 mA"
      points: 10
      spacing: linear
      children:
        - id: keithley-b-current-point
          type: update_keithley_level
          channel: B
          mode: current
          level: "${keithley.B.current}"

        - id: rigol-ch1-frequency-sweep
          type: sweep
          target: rigol.1.frequency
          start: "100 kHz"
          stop: "30 MHz"
          points: 100
          spacing: linear
          children:
            - id: rigol-ch1-frequency-point
              type: update_rigol_frequency
              channel: 1
              frequency: "${rigol.1.frequency}"

            - id: acquire-raw-and-reference-difference
              type: acquire_spectrum
              trace: TRAC1
              reference_operation: difference_db
              store_raw: true
              store_processed: true

finally:
  - id: rigol-ch1-output-off-finally
    type: set_rigol_output
    channel: 1
    enabled: false

  - id: keithley-b-ramp-zero-finally
    type: ramp_keithley_to_zero
    channel: B
    deadline: "30 s"

  - id: keithley-b-output-off-finally
    type: set_keithley_output
    channel: B
    enabled: false
