schema_version: 1
name: "TEMPLATE — Keithley B current × Rigol CH1 × Anritsu (energised)"

# This 100 × 20 template reproduces the requested measurement topology.
# It is intentionally blocked by the distributed station configuration. Before
# compiling it for hardware, an authorised person must enable both output
# permissions, qualify Anritsu standard_scpi_opc and test a single point on a
# laboratory load.

dut_limits:
  keithley:
    B:
      current: {min: "0 A", max: "10 mA"}
      voltage: {min: "-67 mV", max: "67 mV"}
      max_abs_power: "670 uW"
  rigol:
    1:
      minimum_impedance: "50 ohm"
      max_abs_current: "50 uA"
      max_abs_power: "100 nW"
  anritsu:
    max_expected_input: "-10 dBm"

root:
  id: sequence-main
  type: sequence
  children:
    - id: anritsu-spectrum-setup
      type: configure_anritsu
      start_frequency: "1 MHz"
      stop_frequency: "10 MHz"
      reference_level: "0 dBm"
      points: 1001
    - id: keithley-current-sweep
      type: sweep
      target: "keithley.B.current"
      start: "1 mA"
      stop: "10 mA"
      points: 100
      spacing: linear
      children:
        - id: keithley-b-config
          type: configure_keithley
          channel: B
          mode: current
          level: "${keithley.B.current}"
          compliance: "67 mV"
          nplc: 1.0
        - id: keithley-b-on
          type: set_keithley_output
          channel: B
          enabled: true
        - id: rigol-high-level-sweep
          type: sweep
          target: "rigol.1.high_level"
          start: "1 mV"
          stop: "3 mV"
          points: 20
          spacing: linear
          children:
            - id: rigol-ch1-config
              type: configure_rigol
              channel: 1
              waveform: SQU
              frequency: "1 kHz"
              high_level: "${rigol.1.high_level}"
              low_level: "-1 mV"
              output_load: HIGHZ
              dut_min_impedance: "50 ohm"
            - id: rigol-ch1-on
              type: set_rigol_output
              channel: 1
              enabled: true
            - id: wait-for-settle
              type: wait
              duration: "100 ms"
            - id: measure-keithley-b
              type: measure_keithley
              channel: B
            - id: acquire-spectrum
              type: acquire_spectrum
              trace: TRAC1
            - id: rigol-ch1-off
              type: set_rigol_output
              channel: 1
              enabled: false
        - id: keithley-b-ramp-zero
          type: ramp_keithley_to_zero
          channel: B
          deadline: "10 s"
        - id: keithley-b-off
          type: set_keithley_output
          channel: B
          enabled: false

finally:
  - id: rigol-ch1-off-finally
    type: set_rigol_output
    channel: 1
    enabled: false
  - id: keithley-b-ramp-zero-finally
    type: ramp_keithley_to_zero
    channel: B
    deadline: "10 s"
  - id: keithley-b-off-finally
    type: set_keithley_output
    channel: B
    enabled: false
